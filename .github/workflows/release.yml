name: Build and Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: maykr-linux-amd64
            asset_name: maykr-linux-amd64
          - os: windows-latest
            artifact_name: maykr.exe
            asset_name: maykr-windows-amd64.exe
          - os: macos-latest
            artifact_name: maykr
            asset_name: maykr-macos-universal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt
          pip install -e .

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --name ${{ matrix.artifact_name }} maykr/cli.py

      - name: Upload Binary Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
